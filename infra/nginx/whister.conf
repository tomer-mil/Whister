# Single-origin edge proxy for Whister.
#
# Exists so the whole app can sit behind one public URL (a cloudflared quick
# tunnel). Serving the Next.js app and the Socket.IO endpoint from the same
# origin removes two classes of failure that bite as soon as the page is HTTPS:
# mixed-content blocking of a plain-http socket, and CORS on the socket
# handshake. See scripts/share.sh.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream whister_frontend {
    # The Next.js dev server runs on the host, not in Compose; host-gateway is
    # wired up in docker-compose.yml.
    server host.docker.internal:3001;
}

upstream whister_backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;

    # Quick tunnels terminate TLS at Cloudflare's edge and forward plain http,
    # so trust the edge's forwarded scheme rather than $scheme (always "http").
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Socket.IO mounts at /ws/socket.io. No trailing slash on proxy_pass, so the
    # full original URI is preserved.
    location /ws/ {
        proxy_pass http://whister_backend;
        # A game sits idle between tricks; the default 60s read timeout would
        # sever the socket mid-round and force a reconnect.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    location / {
        proxy_pass http://whister_frontend;
        # Covers the Next dev HMR websocket as well as normal page loads.
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }
}
