version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: whist_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whistpass123}
      POSTGRES_DB: ${POSTGRES_DB:-whist_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whist}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whist_network

  redis:
    image: redis:7-alpine
    container_name: whist_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whist_network
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whist_backend
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whist}:${POSTGRES_PASSWORD:-whistpass123}@postgres:5432/${POSTGRES_DB:-whist_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8001:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whist_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Single-origin edge so the app can be shared behind one public URL.
  # Only needed for sharing; plain local dev can talk to 3001/8001 directly.
  edge:
    image: nginx:1.27-alpine
    container_name: whist_edge
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/whister.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # Lets nginx reach the Next.js dev server running on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - whist_network

volumes:
  postgres_data:
  redis_data:

networks:
  whist_network:
    driver: bridge
